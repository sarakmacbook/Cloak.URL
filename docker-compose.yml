version: "3.8"

services:
  cloak:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - DB_PATH=/app/data/urls.db
      - MAX_LINKS=10000
    volumes:
      - ${DB_HOST_PATH:-./data}:/app/data
    restart: unless-stopped
    networks:
      - cloak-net

  # Uncomment for Cloudflare Tunnel:
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${TUNNEL_TOKEN}
  #   networks:
  #     - cloak-net

networks:
  cloak-net:
    driver: bridge
